# Serves the built React app and falls back to index.html for client-side
# routes (React Router). The API is NOT proxied here: the frontend calls
# the backend directly at VITE_API_URL, so the backend's CORS_ORIGIN must
# include this site's origin (see docker-compose.yml).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively; index.html itself is never cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
