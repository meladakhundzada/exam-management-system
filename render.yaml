# Render Blueprint — deploys the whole system with one click.
# In the Render dashboard: New → Blueprint → connect this repo.
# Render creates the database, backend and frontend, then shows their URLs.
# IMPORTANT: read docs/DEPLOY_GUIDE.md first — after the first deploy you
# must run the migrations, create the first Super Admin, and point the
# frontend at the backend URL (VITE_API_URL below is a placeholder that
# Render cannot fill in automatically for a static site).

services:
  # ---- Backend API (Node 20 + Express) --------------------------------
  - type: web
    name: exam-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: exam-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Set this AFTER the first deploy to the frontend's public URL,
      # e.g. https://exam-frontend.onrender.com (comma-separate if more).
      - key: CORS_ORIGIN
        value: https://exam-frontend.onrender.com

  # ---- Frontend (React + Vite static site) -----------------------------
  # NOTE: static sites have no `plan` field — adding `plan: free` here
  # broke the Blueprint ("no such plan free for service type web") and
  # the services were created manually instead. The live static site
  # was created WITHOUT the rewrite rule below, which is why direct
  # loads of /login, /dashboard, /setup, etc. return plain "Not Found"
  # (only / serves the app). Until the live site is redeployed from
  # this Blueprint, add the same rewrite in the Render dashboard:
  # exam-frontend → Redirects/Rewrites → Rewrite /* to /index.html.
  # frontend/public/_redirects ships the same rule in the build output
  # as a second mechanism.
  - type: web
    name: exam-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # MUST be replaced after the first deploy with the real backend URL:
      #   https://exam-api.onrender.com/api
      # (no /v1 — the API mounts routes at /api, see docs/DEPLOY_GUIDE.md)
      - key: VITE_API_URL
        value: https://exam-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ---- PostgreSQL database (private: only Render services reach it) ----
  - name: exam-db
    databaseName: exam_management
    user: exam_user
    plan: free
