name: Extract source ZIP
on:
  push:
    paths:
      - 'deploy-fees.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o deploy-fees.zip
          shopt -s dotglob
          mv exam-management-system-source/* .
          rm -rf exam-management-system-source deploy-fees.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract source tree from ZIP"
          git push
